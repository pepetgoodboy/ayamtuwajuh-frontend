services:
  ayamtuwajuh-frontend:
    container_name: ayamtuwajuh-frontend
    build: .
    image: ayamtuwajuh-frontend:1.0.0
    env_file:
      - .env
    cpus: 0.15
    mem_limit: 64m
    mem_reservation: 16m
    restart: unless-stopped
    networks:
      - pepet-network

networks:
  pepet-network:
    external: true

